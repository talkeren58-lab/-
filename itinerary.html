<meta charset="UTF-8">
<title>לוח זמנים — משלחת קלינית ארה"ב</title>
<style>
  :root {
    --primary-teal: #0092A6;
    --primary-teal-dark: #00707F;
    --secondary-blue: #0056A4;
    --accent-green: #8DC63F;
    --bg: #F7F9FA;
    --text: #2B2E32;
    --text-soft: #5b6469;
    --card-bg: #FFFFFF;
    --shadow: 0 2px 10px rgba(0, 40, 60, 0.08);
    --shadow-hover: 0 8px 24px rgba(0, 40, 60, 0.16);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: 'Calibri', 'Carlito', 'Segoe UI', sans-serif;
  }

  body {
    padding: 0 16px 60px;
    background:
      radial-gradient(circle at 12% 0%, rgba(0, 146, 166, 0.16), transparent 42%),
      radial-gradient(circle at 92% 6%, rgba(0, 86, 164, 0.13), transparent 46%),
      radial-gradient(circle at 50% 115%, rgba(141, 198, 63, 0.14), transparent 45%),
      var(--bg);
    background-attachment: fixed;
  }

  header.page-header {
    max-width: 1000px;
    margin: 0 auto 32px;
    padding: 34px 28px;
    border-radius: 0 0 22px 22px;
    background: linear-gradient(120deg, var(--secondary-blue), var(--primary-teal) 70%);
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0, 60, 90, 0.22);
  }

  header.page-header .icon-row {
    font-size: 1.4rem;
    margin-bottom: 8px;
    letter-spacing: 6px;
  }

  header.page-header h1 {
    font-size: 1.85rem;
    margin: 0 0 8px;
    font-weight: 700;
  }

  header.page-header p {
    margin: 0;
    font-size: 0.98rem;
    color: rgba(255, 255, 255, 0.9);
  }

  .day-grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
    align-items: start;
  }

  .day-card-wrapper {
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s ease;
  }

  .day-card-wrapper:hover {
    box-shadow: var(--shadow-hover);
  }

  .day-card-wrapper.expanded {
    grid-column: 1 / -1;
  }

  .day-card-summary {
    all: unset;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    padding: 18px 20px;
    cursor: pointer;
    border-right: 7px solid var(--primary-teal);
    background: linear-gradient(180deg, rgba(0, 146, 166, 0.06), transparent 60%);
  }

  .day-card-wrapper.rest-day .day-card-summary {
    border-right-color: var(--accent-green);
  }

  .day-card-wrapper.travel-day .day-card-summary {
    border-right-color: var(--secondary-blue);
  }

  .day-card-summary:active {
    background: rgba(0, 146, 166, 0.1);
  }

  .day-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .day-number-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--secondary-blue), var(--primary-teal));
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .day-date {
    font-size: 0.85rem;
    color: var(--text-soft);
  }

  .day-city {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 1.08rem;
    color: var(--primary-teal-dark);
  }

  .day-theme {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.45;
    color: var(--text);
  }

  .day-card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
  }

  .expand-hint {
    font-size: 0.8rem;
    color: var(--primary-teal-dark);
    font-weight: 700;
  }

  .chevron {
    display: inline-block;
    transition: transform 0.2s ease;
    color: var(--primary-teal-dark);
    font-size: 1.1rem;
  }

  .day-card-wrapper.expanded .chevron {
    transform: rotate(180deg);
  }

  .day-detail {
    padding: 0 22px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, padding 0.25s ease;
  }

  .day-card-wrapper.expanded .day-detail {
    max-height: 2400px;
    padding: 6px 22px 24px;
  }

  .schedule-block {
    border-radius: 14px;
    background: #fbfdfd;
    border: 1px solid #e7edee;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .schedule-block h3 {
    margin: 0 0 10px;
    font-size: 1rem;
    color: var(--secondary-blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .schedule-block h3 .loc {
    font-weight: 400;
    font-size: 0.82rem;
    color: var(--text-soft);
  }

  .sched-item {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px dashed #e2e8e9;
  }

  .sched-item:first-child {
    border-top: none;
  }

  .sched-time {
    flex: 0 0 auto;
    min-width: 108px;
    font-weight: 700;
    color: var(--primary-teal-dark);
    font-size: 0.85rem;
  }

  .sched-body h4 {
    margin: 0 0 2px;
    font-size: 0.92rem;
    color: var(--text);
  }

  .sched-body p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-soft);
    line-height: 1.4;
  }

  .sched-item.travel-item .sched-time {
    color: #7a8388;
  }

  .sched-item.travel-item .sched-body h4 {
    color: var(--text-soft);
    font-weight: 400;
  }

  .sched-item.travel-item {
    opacity: 0.85;
  }

  .org-mention {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 6px;
    background: rgba(0, 86, 164, 0.09);
    color: var(--secondary-blue);
    font-weight: 700;
    font-size: 0.85em;
  }

  .group-note {
    margin: 4px 0 14px;
    font-size: 0.85rem;
    color: var(--text-soft);
    background: rgba(141, 198, 63, 0.14);
    border-radius: 10px;
    padding: 8px 12px;
  }

  .group-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .group-tab {
    all: unset;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 700;
    background: #eef3f4;
    color: var(--text-soft);
    border: 2px solid transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .group-tab.active {
    background: rgba(0, 146, 166, 0.12);
    color: var(--primary-teal-dark);
    border-color: var(--primary-teal);
  }

  .group-panel {
    display: none;
  }

  .group-panel.active {
    display: block;
  }

  footer.note {
    max-width: 1000px;
    margin: 28px auto 0;
    font-size: 0.8rem;
    color: #8a9297;
    text-align: center;
  }

  @media (max-width: 480px) {
    body {
      padding: 0 10px 40px;
    }
    header.page-header {
      padding: 26px 18px;
      margin-bottom: 24px;
    }
    .day-grid {
      grid-template-columns: 1fr;
    }
    .day-card-summary {
      padding: 16px;
    }
    .sched-item {
      flex-direction: column;
      gap: 2px;
    }
    .sched-time {
      min-width: unset;
    }
    .group-tab {
      flex: 1 1 auto;
      text-align: center;
      padding: 10px 12px;
    }
  }
</style>

<html dir="rtl" lang="he">
<body>
  <header class="page-header">
    <div class="icon-row">✈️ 🏥 🇺🇸</div>
    <h1>משלחת קלינית — ארה"ב 2026</h1>
    <p>סקירת לוח הזמנים היומי של המשלחת · הקישו על יום להרחבת הפרטים</p>
  </header>

  <main class="day-grid" id="dayGrid"></main>

  <footer class="note">שלב 1 (המשך) — הדגמת עיצוב ופירוט שעתי ליום 2 בלבד</footer>

  <script>
    const itinerary = [
      {
        day: 1,
        date: "2026-07-19",
        weekday: "ראשון",
        city: "ניו יורק",
        theme: "טיסה לניו יורק ומפגש פתיחה של המשלחת",
        detail: {
          simple: [
            { time: "19:30", title: "מפגש פתיחה של המשלחת", desc: "" }
          ]
        }
      },
      {
        day: 2,
        date: "2026-07-20",
        weekday: "שני",
        city: "ניו יורק",
        theme: `ביקור אצל <span class="org-mention">Northwell Health</span> (לקוח <span class="org-mention">Epic</span>)`,
        detail: {
          intro: {
            title: "מושב פתיחה",
            location: "59th St, קומה 16, חדר ישיבות",
            items: [
              { time: "8:30–9:30", title: `רקע על <span class="org-mention">Epic</span>`, desc: "הקשר, היסטוריה, מבנה היישום, לפני ואחרי עליית Epic לאוויר, מפת דרכים עתידית" },
              { time: "9:30–10:30", title: "שאלות ותשובות", desc: "" }
            ]
          },
          groupNote: "המשלחת מתפצלת כאן לשלוש קבוצות מקבילות — בחרו את הקבוצה הרלוונטית:",
          groups: [
            {
              key: "ambulatory",
              label: "אמבולטורי",
              sub: "Ambulatory",
              items: [
                { time: "10:30–11:30", title: "הצגה (59th, מיקום בהמתנה)", desc: "תהליך יישום והכנה מקומי לעליה לאוויר; סטנדרטיזציה והתאמה אישית" },
                { time: "11:30–11:45", title: "מעבר לאתרים אמבולטוריים", desc: "נסיעה לשני אתרים אמבולטוריים", travel: true },
                { time: "11:45–12:30", title: "סיורים באתרים אמבולטוריים", desc: "סיור מודרך באתר האמבולטורי" },
                { time: "12:30–12:45", title: "מעבר חזרה ל-59th St", desc: "נסיעה חזרה לקומה 16", travel: true }
              ]
            },
            {
              key: "lenoxhill",
              label: "לנוקס היל",
              sub: "Lenox Hill",
              items: [
                { time: "10:30–10:45", title: "מעבר ל-Lenox Hill", desc: "נסיעה ל-Lenox Hill", travel: true },
                { time: "10:45–11:45", title: "הצגה (Lenox Hill, מיקום בהמתנה)", desc: "תהליך יישום והכנה מקומי לעליה לאוויר; סטנדרטיזציה והתאמה אישית" },
                { time: "11:45–12:30", title: "סיור באתר Lenox Hill", desc: "סיור מודרך באתר" },
                { time: "12:30–12:45", title: "מעבר חזרה ל-59th St", desc: "נסיעה חזרה לקומה 16", travel: true }
              ]
            },
            {
              key: "technology",
              label: "טכנולוגיה",
              sub: "Technology",
              items: [
                { time: "10:30–11:30", title: "הצגה (59th, מיקום בהמתנה)", desc: "סקירת אפליקציה, טכנולוגיה, ואינטגרציית נתונים" },
                { time: "11:30–11:45", title: "מעבר ל-Lenox Hill", desc: "נסיעה ל-Lenox Hill", travel: true },
                { time: "11:45–12:30", title: "סיור באתר Lenox Hill", desc: "סיור מודרך באתר" },
                { time: "12:30–12:45", title: "מעבר חזרה ל-59th St", desc: "נסיעה חזרה לקומה 16", travel: true }
              ]
            }
          ],
          outro: {
            title: "סיום משותף",
            location: "59th St, קומה 16, חדר ישיבות",
            items: [
              { time: "12:30–13:30", title: "ארוחת צהריים", desc: "הפסקת צהריים" },
              { time: "13:30–14:30", title: "מושב סיום", desc: "תחקיר ושאלות ותשובות" }
            ]
          }
        }
      }
    ];

    function formatDate(iso, weekday) {
      const [y, m, d] = iso.split("-");
      return `יום ${weekday}, ${d}.${m}.${y}`;
    }

    function ltr(s) {
      return `<span dir="ltr" style="unicode-bidi:isolate">${s}</span>`;
    }

    function renderSchedItem(item) {
      return `
        <div class="sched-item ${item.travel ? "travel-item" : ""}">
          <div class="sched-time">${ltr(item.time)}</div>
          <div class="sched-body">
            <h4>${item.title}</h4>
            ${item.desc ? `<p>${item.desc}</p>` : ""}
          </div>
        </div>
      `;
    }

    function renderBlock(block) {
      return `
        <div class="schedule-block">
          <h3>${block.title} <span class="loc">— ${block.location}</span></h3>
          ${block.items.map(renderSchedItem).join("")}
        </div>
      `;
    }

    function renderDetail(detail, dayId) {
      if (detail.simple) {
        return `
          <div class="schedule-block">
            ${detail.simple.map(renderSchedItem).join("")}
          </div>
        `;
      }

      const tabs = detail.groups.map((g, i) => `
        <button type="button" class="group-tab ${i === 0 ? "active" : ""}" data-group="${g.key}">
          ${g.label} <span style="font-weight:400; opacity:.75;">${ltr(g.sub)}</span>
        </button>
      `).join("");

      const panels = detail.groups.map((g, i) => `
        <div class="group-panel ${i === 0 ? "active" : ""}" data-group-panel="${g.key}">
          <div class="schedule-block">
            ${g.items.map(renderSchedItem).join("")}
          </div>
        </div>
      `).join("");

      return `
        ${renderBlock(detail.intro)}
        <p class="group-note">${detail.groupNote}</p>
        <div class="group-tabs" id="tabs-${dayId}">${tabs}</div>
        <div id="panels-${dayId}">${panels}</div>
        ${renderBlock(detail.outro)}
      `;
    }

    function renderCard(dayData) {
      const wrapper = document.createElement("div");
      wrapper.className = "day-card-wrapper";
      if (dayData.isRestDay) wrapper.classList.add("rest-day");
      if (dayData.isTravelDay) wrapper.classList.add("travel-day");

      const summary = document.createElement("button");
      summary.type = "button";
      summary.className = "day-card-summary";
      summary.setAttribute("aria-expanded", "false");
      summary.innerHTML = `
        <div class="day-card-top">
          <span class="day-number-badge">יום ${dayData.day}</span>
          <span class="day-date">${formatDate(dayData.date, dayData.weekday)}</span>
        </div>
        <span class="day-city">📍 ${dayData.city}</span>
        <p class="day-theme">${dayData.theme}</p>
        <div class="day-card-bottom">
          <span class="expand-hint">לוח זמנים מפורט</span>
          <span class="chevron">⌄</span>
        </div>
      `;

      const detailEl = document.createElement("div");
      detailEl.className = "day-detail";
      detailEl.innerHTML = renderDetail(dayData.detail, dayData.day);

      summary.addEventListener("click", () => {
        const isExpanded = wrapper.classList.toggle("expanded");
        summary.setAttribute("aria-expanded", String(isExpanded));
      });

      detailEl.addEventListener("click", (e) => {
        const tabBtn = e.target.closest(".group-tab");
        if (!tabBtn) return;
        const groupKey = tabBtn.dataset.group;
        const tabsContainer = tabBtn.parentElement;
        tabsContainer.querySelectorAll(".group-tab").forEach(b => b.classList.toggle("active", b === tabBtn));
        const panelsContainer = tabsContainer.nextElementSibling;
        panelsContainer.querySelectorAll(".group-panel").forEach(p => {
          p.classList.toggle("active", p.dataset.groupPanel === groupKey);
        });
      });

      wrapper.appendChild(summary);
      wrapper.appendChild(detailEl);
      return wrapper;
    }

    const grid = document.getElementById("dayGrid");
    itinerary.forEach(d => grid.appendChild(renderCard(d)));
  </script>
</body>
</html>
