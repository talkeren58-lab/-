<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח חתונה — טל ועדי</title>
<style>
:root{
  --cream:#faf5ee;
  --cream-2:#f3e9dd;
  --card:#ffffff;
  --ink:#3a2f2a;
  --ink-soft:#7a6b62;
  --rose:#c98a7a;
  --rose-dark:#a8624f;
  --sage:#8a9a7b;
  --sage-dark:#697a5c;
  --gold:#c9a05c;
  --line:#e8ddd0;
  --danger:#c0524a;
  --danger-bg:#fbeae7;
  --warn:#c98a3d;
  --warn-bg:#fbf1e2;
  --ok:#5f8f5a;
  --ok-bg:#eaf3e7;
  --shadow: 0 2px 10px rgba(58,47,42,.06), 0 1px 2px rgba(58,47,42,.05);
  --radius: 16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --cream:#221c19; --cream-2:#2a2320; --card:#2c2521; --ink:#f1e7dc; --ink-soft:#c2b2a6;
    --line:#42362f; --rose:#e0998a; --rose-dark:#e6a998; --sage:#a3b494; --sage-dark:#b7c7aa;
    --gold:#dcb676; --danger:#e28579; --danger-bg:#3a2422; --warn:#e0a961; --warn-bg:#3a2e1c;
    --ok:#8fbf8a; --ok-bg:#1f2f1e; --shadow: 0 2px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --cream:#221c19; --cream-2:#2a2320; --card:#2c2521; --ink:#f1e7dc; --ink-soft:#c2b2a6;
  --line:#42362f; --rose:#e0998a; --rose-dark:#e6a998; --sage:#a3b494; --sage-dark:#b7c7aa;
  --gold:#dcb676; --danger:#e28579; --danger-bg:#3a2422; --warn:#e0a961; --warn-bg:#3a2e1c;
  --ok:#8fbf8a; --ok-bg:#1f2f1e; --shadow: 0 2px 14px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --cream:#faf5ee; --cream-2:#f3e9dd; --card:#ffffff; --ink:#3a2f2a; --ink-soft:#7a6b62;
  --rose:#c98a7a; --rose-dark:#a8624f; --sage:#8a9a7b; --sage-dark:#697a5c; --gold:#c9a05c;
  --line:#e8ddd0; --danger:#c0524a; --danger-bg:#fbeae7; --warn:#c98a3d; --warn-bg:#fbf1e2;
  --ok:#5f8f5a; --ok-bg:#eaf3e7; --shadow: 0 2px 10px rgba(58,47,42,.06), 0 1px 2px rgba(58,47,42,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI","Assistant","Arial Hebrew","Arial",sans-serif;
  background:linear-gradient(180deg,var(--cream),var(--cream-2));
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3{font-family:Georgia,"David","Times New Roman",serif; font-weight:600; margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
#app{max-width:1400px; margin:0 auto; padding:0 18px 60px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:18px 4px 14px;
}
.home-btn{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  width:44px; height:44px; font-size:19px; box-shadow:var(--shadow);
}
.title-block{text-align:center; flex:1;}
.title-block h1{font-size:clamp(22px,4vw,32px); color:var(--rose-dark); letter-spacing:.5px;}
.title-block h1 .amp{color:var(--gold); margin:0 6px;}
.subtitle{margin:2px 0 0; color:var(--ink-soft); font-size:14px;}
.topbar-actions{display:flex; gap:8px;}
.icon-btn{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  width:40px; height:40px; font-size:16px; box-shadow:var(--shadow); color:var(--ink);
}
.icon-btn:hover, .home-btn:hover{border-color:var(--rose);}

.view{display:none; opacity:0; transform:translateY(14px); transition:opacity .28s ease, transform .28s ease;}
.view.visible{opacity:1; transform:translateY(0);}

.home-grid{
  display:grid;
  grid-template-columns: 1.1fr 2fr 1.1fr;
  grid-template-rows: auto auto;
  grid-template-areas:
    "tasks guests cal"
    "tasks guests budget";
  gap:18px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px; cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(58,47,42,.12);}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.card-head h2{font-size:18px; color:var(--ink);}
.chevron{color:var(--ink-soft); font-size:20px;}
.card-calendar{grid-area:cal;}
.card-guests{grid-area:guests;}
.card-tasks{grid-area:tasks; display:flex; flex-direction:column; max-height:640px;}
.card-budget{grid-area:budget;}

.scroll-panel{overflow-y:auto; flex:1;}

/* mini calendar */
.mini-cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:14px; color:var(--ink-soft);}
.mini-cal-nav button{background:none;border:none;font-size:16px;color:var(--rose-dark);padding:2px 8px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center;}
.cal-dow{font-size:11px; color:var(--ink-soft); padding:2px 0;}
.cal-day{
  position:relative; padding:6px 0; border-radius:8px; font-size:13px; color:var(--ink);
  background:transparent; border:1px solid transparent; cursor:pointer;
}
.cal-day.out{color:var(--ink-soft); opacity:.35;}
.cal-day.today{border-color:var(--gold); font-weight:700;}
.cal-day:hover{background:var(--cream-2);}
.cal-day .dot-row{display:flex; gap:2px; justify-content:center; margin-top:2px; height:5px;}
.dot{width:5px; height:5px; border-radius:50%;}
.dot-task{background:var(--rose);}
.dot-milestone{background:var(--sage);}
.dot-wedding{background:var(--gold);}
.dot-budget{background:var(--danger);}
.cal-legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--ink-soft);}
.cal-legend span{display:inline-flex; align-items:center; gap:4px;}

/* guest summary */
.stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
.stat-box{flex:1; min-width:80px; background:var(--cream-2); border-radius:12px; padding:10px 12px; text-align:center;}
.stat-box .num{font-size:26px; font-weight:700; color:var(--rose-dark); font-family:Georgia,serif;}
.stat-box .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.side-bars{display:flex; flex-direction:column; gap:10px;}
.side-bar-row{display:flex; align-items:center; gap:10px;}
.side-bar-name{width:60px; font-size:13px; font-weight:600;}
.side-bar-track{flex:1; height:10px; background:var(--cream-2); border-radius:6px; overflow:hidden; display:flex;}
.side-bar-fill{height:100%;}
.side-bar-num{font-size:12px; color:var(--ink-soft); width:80px; text-align:left;}

/* task panel rows */
.task-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px;
  border-inline-start:4px solid var(--line); margin-bottom:6px; background:var(--cream-2);
  cursor:pointer;
}
.task-row.status-not_started{border-inline-start-color:var(--ink-soft);}
.task-row.status-in_progress{border-inline-start-color:var(--warn); background:var(--warn-bg);}
.task-row.status-done{border-inline-start-color:var(--ok); background:var(--ok-bg); opacity:.75;}
.task-row.status-done .task-text{text-decoration:line-through;}
.task-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.urgency-urgent .task-dot, .badge-urgent{background:var(--danger);}
.urgency-high .task-dot, .badge-high{background:var(--warn);}
.urgency-medium .task-dot, .badge-medium{background:var(--gold);}
.urgency-low .task-dot, .badge-low{background:var(--sage);}
.task-body{flex:1; min-width:0;}
.task-text{font-size:13.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.task-meta{font-size:11px; color:var(--ink-soft); display:flex; gap:8px; margin-top:2px;}
.task-cat-tag{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:0 6px;}

/* budget summary */
.budget-progress{background:var(--cream-2); border-radius:10px; height:14px; overflow:hidden; margin:8px 0 14px;}
.budget-progress-fill{height:100%; background:linear-gradient(90deg,var(--sage),var(--gold));}
.budget-nums{display:flex; justify-content:space-between; font-size:13px;}
.budget-nums b{display:block; font-size:20px; font-family:Georgia,serif;}

/* drill-down heads */
.drill-head{display:flex; align-items:center; gap:14px; margin:18px 0 16px; flex-wrap:wrap;}
.drill-head h2{flex:1; font-size:22px; color:var(--rose-dark); min-width:150px;}
.back-btn{
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px;
  font-size:14px; box-shadow:var(--shadow); color:var(--ink);
}
.add-btn{
  background:var(--rose); color:#fff; border:none; border-radius:10px; padding:9px 16px;
  font-size:14px; font-weight:600; box-shadow:var(--shadow);
}
.add-btn:hover{background:var(--rose-dark);}

.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filters input[type=text], .filters select{
  padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:13.5px;
}
.filters input[type=text]{min-width:180px;}

/* full task list */
.cat-group{margin-bottom:22px;}
.cat-group h3{font-size:15px; color:var(--sage-dark); border-bottom:2px solid var(--line); padding-bottom:6px; margin-bottom:10px;}
.task-row-full{
  display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border-radius:12px;
  border-inline-start:5px solid var(--line); margin-bottom:8px; background:var(--card); box-shadow:var(--shadow);
}
.task-row-full.status-not_started{border-inline-start-color:var(--ink-soft);}
.task-row-full.status-in_progress{border-inline-start-color:var(--warn);}
.task-row-full.status-done{border-inline-start-color:var(--ok); opacity:.7;}
.status-pill{
  border:none; border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; color:#fff; flex-shrink:0; white-space:nowrap;
}
.status-pill.status-not_started{background:var(--ink-soft);}
.status-pill.status-in_progress{background:var(--warn);}
.status-pill.status-done{background:var(--ok);}
.task-row-full .task-body{flex:1;}
.task-row-full .task-text{white-space:normal; font-size:14.5px; font-weight:500;}
.task-row-full.status-done .task-text{text-decoration:line-through;}
.badge{border-radius:20px; padding:2px 10px; font-size:11px; color:#fff; font-weight:600;}
.icon-action{background:none; border:none; font-size:15px; color:var(--ink-soft); padding:4px 6px; border-radius:6px;}
.icon-action:hover{background:var(--cream-2); color:var(--danger);}

/* calendar full */
.cal-full-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-full-day{
  min-height:78px; border:1px solid var(--line); border-radius:10px; padding:6px; text-align:right; cursor:pointer;
  background:var(--card); font-size:12.5px;
}
.cal-full-day.out{opacity:.35;}
.cal-full-day.today{border-color:var(--gold); border-width:2px;}
.cal-full-day:hover{background:var(--cream-2);}
.cal-full-day .num{font-weight:700; font-size:13px;}
.cal-full-day .ev-line{font-size:10.5px; margin-top:3px; padding:1px 4px; border-radius:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ev-line.et-task{background:var(--danger-bg); color:var(--danger-dark,var(--danger));}
.ev-line.et-milestone{background:var(--ok-bg); color:var(--sage-dark);}
.ev-line.et-wedding{background:var(--gold); color:#fff; font-weight:700;}
.ev-line.et-budget{background:var(--warn-bg); color:var(--warn);}

.day-detail{
  margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;
  box-shadow:var(--shadow);
}
.day-detail.hidden{display:none;}
.day-detail h3{color:var(--rose-dark); margin-bottom:10px;}
.dd-event{padding:10px 12px; border-radius:10px; background:var(--cream-2); margin-bottom:8px; font-size:13.5px;}
.dd-event .dd-title{font-weight:600;}
.dd-event .dd-note{color:var(--ink-soft); font-size:12px; margin-top:2px;}
.dd-notes-label{font-size:13px; color:var(--ink-soft); margin:14px 0 6px;}
.dd-notes textarea{
  width:100%; min-height:110px; border:1px solid var(--line); border-radius:10px; padding:10px;
  font-size:14px; resize:vertical; background:var(--cream); color:var(--ink);
}
.save-indicator{font-size:11px; color:var(--ok); opacity:0; transition:opacity .3s;}
.save-indicator.show{opacity:1;}

/* tables */
.data-table-wrap{overflow-x:auto; background:var(--card); border-radius:14px; box-shadow:var(--shadow);}
table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.data-table th{
  background:var(--cream-2); text-align:right; padding:10px 12px; font-size:12.5px; color:var(--ink-soft);
  cursor:pointer; white-space:nowrap; position:sticky; top:0;
}
table.data-table td{padding:9px 12px; border-top:1px solid var(--line); vertical-align:middle;}
table.data-table tr:hover td{background:var(--cream-2);}
.editable{cursor:text; border-bottom:1px dashed var(--line);}
.editable:hover{border-bottom-color:var(--rose);}
.pill{border-radius:20px; padding:3px 10px; font-size:11.5px; font-weight:600; color:#fff; display:inline-block; white-space:nowrap;}
.pill-pending{background:var(--ink-soft);}
.pill-approved{background:var(--ok);}
.pill-declined{background:var(--danger);}
.pill.clickable{cursor:pointer;}
.balance-flag{background:var(--danger-bg); color:var(--danger); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700;}
.paid-flag{background:var(--ok-bg); color:var(--ok); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700;}
tfoot td{font-weight:700; background:var(--cream-2); border-top:2px solid var(--line);}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(58,47,42,.45); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal-box{
  background:var(--card); border-radius:16px; padding:24px; max-width:480px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25);
  max-height:88vh; overflow-y:auto;
}
.modal-box h3{margin-bottom:16px; color:var(--rose-dark);}
.form-row{margin-bottom:12px; display:flex; flex-direction:column; gap:4px;}
.form-row label{font-size:12.5px; color:var(--ink-soft);}
.form-row input, .form-row select, .form-row textarea{
  padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--cream); color:var(--ink);
}
.form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
.btn-secondary{background:var(--cream-2); border:1px solid var(--line); border-radius:9px; padding:9px 16px; font-size:13.5px;}
.btn-primary{background:var(--rose); color:#fff; border:none; border-radius:9px; padding:9px 18px; font-size:13.5px; font-weight:600;}
.btn-danger{background:var(--danger); color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:13.5px;}

.funding-block{margin-top:26px;}
.funding-block h3{font-size:16px; color:var(--sage-dark); margin-bottom:10px;}

.empty-note{color:var(--ink-soft); font-size:13px; padding:12px 4px;}
.assumption-note{
  background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 14px; font-size:12.5px; margin-bottom:14px;
}

@media (max-width:900px){
  .home-grid{grid-template-columns:1fr; grid-template-areas:"guests" "cal" "budget" "tasks";}
  .card-tasks{max-height:480px;}
  .cal-full-day{min-height:60px; font-size:11px;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="home-btn" id="btnHome" title="בית">🏠</button>
    <div class="title-block">
      <h1 id="coupleTitle">טל <span class="amp">&</span> עדי</h1>
      <p class="subtitle" id="countdownText"></p>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnExport" title="ייצוא גיבוי (JSON)">⬇︎</button>
      <button class="icon-btn" id="btnImport" title="ייבוא נתונים (JSON)">⬆︎</button>
      <button class="icon-btn" id="btnReset" title="איפוס לנתוני המקור">↺</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
    </div>
  </header>

  <main id="view-home" class="view active">
    <div class="home-grid">
      <section class="card card-calendar" data-nav="calendar">
        <div class="card-head"><h2>לוח שנה</h2><span class="chevron">›</span></div>
        <div id="miniCalendar"></div>
      </section>
      <section class="card card-guests" data-nav="guests">
        <div class="card-head"><h2>מוזמנים</h2><span class="chevron">›</span></div>
        <div id="guestSummary"></div>
      </section>
      <section class="card card-tasks" data-nav="tasks">
        <div class="card-head"><h2>משימות</h2><span class="chevron">›</span></div>
        <div id="taskPanel" class="scroll-panel"></div>
      </section>
      <section class="card card-budget" data-nav="budget">
        <div class="card-head"><h2>תקציב</h2><span class="chevron">›</span></div>
        <div id="budgetSummary"></div>
      </section>
    </div>
  </main>

  <main id="view-tasks" class="view">
    <div class="drill-head">
      <button class="back-btn" data-nav="home">→ בית</button>
      <h2>כל המשימות</h2>
      <button class="add-btn" id="addTaskBtn">+ משימה חדשה</button>
    </div>
    <div class="filters" id="taskFilters"></div>
    <div id="taskFull"></div>
  </main>

  <main id="view-calendar" class="view">
    <div class="drill-head"><button class="back-btn" data-nav="home">→ בית</button><h2>לוח שנה מלא</h2></div>
    <div id="calendarFull"></div>
    <div id="dayDetail" class="day-detail hidden"></div>
  </main>

  <main id="view-guests" class="view">
    <div class="drill-head">
      <button class="back-btn" data-nav="home">→ בית</button>
      <h2>רשימת מוזמנים</h2>
      <button class="add-btn" id="addGuestBtn">+ מוזמן חדש</button>
    </div>
    <div class="filters" id="guestFilters"></div>
    <div id="guestFull"></div>
  </main>

  <main id="view-budget" class="view">
    <div class="drill-head">
      <button class="back-btn" data-nav="home">→ בית</button>
      <h2>תקציב מפורט</h2>
      <button class="add-btn" id="addBudgetBtn">+ הוצאה חדשה</button>
    </div>
    <div id="budgetFull"></div>
    <div class="funding-block">
      <h3>מקורות מימון</h3>
      <div id="fundingFull"></div>
      <div class="drill-head" style="margin-top:12px;">
        <button class="add-btn" id="addFundingBtn">+ מקור מימון</button>
      </div>
    </div>
  </main>
</div>

d":50000,"received":18000,"note":null},{"source":"קיבוץ","pledged":48200,"received":48200,"note":"נכנס לעדי"}],"extraEvents":[{"date":"2026-11-14","type":"milestone","title":"רווקות","note":"ערב רווקות של עדי"},{"date":"2026-11-14","type":"milestone","title":"רווקים","note":"ערב רווקים של טל"},{"date":"2026-12-07","type":"milestone","title":"מקווה","note":"טבילת עדי לקראת החתונה"},{"date":"2026-12-10","type":"wedding","title":"החתונה!","note":"היום הגדול - טל ועדי"},{"date":"2026-12-10","type":"milestone","title":"מדבר","note":"פריט מהגאנט המקורי - כדאי לוודא פרטים"}]};

<script>
/* ---------- constants ---------- */
const STORAGE_KEY = 'weddingDashboard_v1';
const HEBREW_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HEBREW_DOW = ['א','ב','ג','ד','ה','ו','ש'];
const URGENCY_ORDER = {urgent:0, high:1, medium:2, low:3};
const URGENCY_LABEL = {urgent:'דחוף', high:'גבוהה', medium:'בינונית', low:'נמוכה'};
const STATUS_LABEL = {not_started:'טרם התחיל', in_progress:'בתהליך', done:'הושלם'};
const GSTATUS_LABEL = {pending:'ממתין', approved:'מאושר', declined:'לא מגיע'};
const CATEGORIES = ['ליבה ארגונית','חופה','ספקים ואולם','בר ואלכוהול','חוויה ודקור','לוגיסטיקה','לבוש וטיפוח','תכשיטים','קרוב לתאריך','במעקב (לא באחריות ישירה)'];

/* ---------- state ---------- */
let STATE = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.guests)) return parsed;
    }
  }catch(e){ console.warn('state load failed', e); }
  const fresh = JSON.parse(JSON.stringify(DATA_DEFAULT));
  fresh.notes = fresh.notes || {};
  return fresh;
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}
function nextId(arr){
  return arr.reduce((m,x)=>Math.max(m, x.id||0), 0) + 1;
}
function fmt(n){
  return Math.round(n).toLocaleString('he-IL');
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatHeDate(s){
  const d = parseDate(s);
  return d.getDate()+' ב'+HEBREW_MONTHS[d.getMonth()]+' '+d.getFullYear();
}

/* ---------- CRUD ---------- */
function addGuest(obj){ obj.id = nextId(STATE.guests); STATE.guests.push(obj); saveState(); }
function updateGuest(id, patch){ const g = STATE.guests.find(x=>x.id===id); if(g){ Object.assign(g, patch); saveState(); } }
function deleteGuest(id){ STATE.guests = STATE.guests.filter(x=>x.id!==id); saveState(); }
function cycleGuestStatus(id){
  const g = STATE.guests.find(x=>x.id===id); if(!g) return;
  const order = ['pending','approved','declined'];
  g.status = order[(order.indexOf(g.status)+1)%order.length];
  saveState();
}

function addTask(obj){ obj.id = nextId(STATE.tasks); obj.status = obj.status || 'not_started'; STATE.tasks.push(obj); saveState(); }
function updateTask(id, patch){ const t = STATE.tasks.find(x=>x.id===id); if(t){ Object.assign(t, patch); saveState(); } }
function deleteTask(id){ STATE.tasks = STATE.tasks.filter(x=>x.id!==id); saveState(); }
function cycleTaskStatus(id){
  const t = STATE.tasks.find(x=>x.id===id); if(!t) return;
  const order = ['not_started','in_progress','done'];
  t.status = order[(order.indexOf(t.status)+1)%order.length];
  saveState();
}

function addBudgetItem(obj){ obj.id = nextId(STATE.budgetItems); obj.remaining = (obj.cost||0)-(obj.paid||0); STATE.budgetItems.push(obj); saveState(); }
function updateBudgetItem(id, patch){
  const b = STATE.budgetItems.find(x=>x.id===id); if(!b) return;
  Object.assign(b, patch);
  b.remaining = (b.cost||0) - (b.paid||0);
  saveState();
}
function deleteBudgetItem(id){ STATE.budgetItems = STATE.budgetItems.filter(x=>x.id!==id); saveState(); }

function addFunding(obj){ obj.id = nextId(STATE.funding); STATE.funding.push(obj); saveState(); }
function updateFunding(id, patch){ const f = STATE.funding.find(x=>x.id===id); if(f){ Object.assign(f, patch); saveState(); } }
function deleteFunding(id){ STATE.funding = STATE.funding.filter(x=>x.id!==id); saveState(); }

/* ---------- derived ---------- */
function guestTotals(){
  const t = {total:0, pending:0, approved:0, declined:0, bySide:{}};
  STATE.guests.forEach(g=>{
    t.total += g.qty||1;
    t[g.status] = (t[g.status]||0) + (g.qty||1);
    const s = g.side || 'לא צוין';
    t.bySide[s] = t.bySide[s] || {total:0, pending:0, approved:0, declined:0};
    t.bySide[s].total += g.qty||1;
    t.bySide[s][g.status] = (t.bySide[s][g.status]||0) + (g.qty||1);
  });
  return t;
}
function sortedTasks(list){
  return [...list].sort((a,b)=>{
    if(a.status!==b.status){ const so={not_started:0,in_progress:1,done:2}; return so[a.status]-so[b.status]; }
    const ua = URGENCY_ORDER[a.urgency]??2, ub = URGENCY_ORDER[b.urgency]??2;
    if(ua!==ub) return ua-ub;
    if(a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
    if(a.deadline) return -1;
    if(b.deadline) return 1;
    return 0;
  });
}
function budgetTotals(){
  const cost = STATE.budgetItems.reduce((s,b)=>s+(b.cost||0),0);
  const paid = STATE.budgetItems.reduce((s,b)=>s+(b.paid||0),0);
  return {cost, paid, remaining: cost-paid};
}
function eventsForDate(dateStr){
  const evs = [];
  STATE.tasks.forEach(t=>{ if(t.deadline===dateStr) evs.push({type:'task', title:t.text, note:t.note, taskId:t.id}); });
  (STATE.extraEvents||[]).forEach(e=>{ if(e.date===dateStr) evs.push({type:e.type, title:e.title, note:e.note}); });
  STATE.budgetItems.forEach(b=>{ if(b.dueDate===dateStr && b.remaining>0) evs.push({type:'budget', title:'תשלום לספק: '+b.vendor, note:'יתרה לתשלום: ₪'+fmt(b.remaining)}); });
  return evs;
}
function allEventDates(){
  const set = new Set();
  STATE.tasks.forEach(t=>{ if(t.deadline) set.add(t.deadline); });
  (STATE.extraEvents||[]).forEach(e=>set.add(e.date));
  STATE.budgetItems.forEach(b=>{ if(b.dueDate && b.remaining>0) set.add(b.dueDate); });
  return set;
}

/* ---------- navigation ---------- */
function showView(id){
  document.querySelectorAll('.view').forEach(v=>{
    if(v.id===id){
      v.style.display='block';
      requestAnimationFrame(()=>v.classList.add('visible'));
    } else {
      v.classList.remove('visible');
      setTimeout(()=>{ if(!v.classList.contains('visible')) v.style.display='none'; }, 260);
    }
  });
  window.scrollTo({top:0, behavior:'smooth'});
}
function nav(name){
  const map = {home:'view-home', tasks:'view-tasks', calendar:'view-calendar', guests:'view-guests', budget:'view-budget'};
  showView(map[name]);
  if(name==='tasks') renderTaskFull();
  if(name==='calendar') renderCalendarFull();
  if(name==='guests') renderGuestFull();
  if(name==='budget') renderBudgetFull();
  if(name==='home') renderHome();
}

/* ---------- modal helper ---------- */
function openModal(title, fieldsHtml, onSave, extraButtons){
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <h3>${title}</h3>
    <form id="modalForm">${fieldsHtml}</form>
    <div class="form-actions">
      ${extraButtons||''}
      <button type="button" class="btn-secondary" id="modalCancel">ביטול</button>
      <button type="button" class="btn-primary" id="modalSave">שמירה</button>
    </div>
  </div>`;
  root.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) root.removeChild(overlay); });
  overlay.querySelector('#modalCancel').addEventListener('click', ()=>root.removeChild(overlay));
  overlay.querySelector('#modalSave').addEventListener('click', ()=>{
    const form = overlay.querySelector('#modalForm');
    const data = {};
    form.querySelectorAll('[data-field]').forEach(el=>{
      data[el.dataset.field] = el.type==='number' ? (parseFloat(el.value)||0) : el.value.trim();
    });
    onSave(data);
    root.removeChild(overlay);
  });
  return overlay;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= HOME ================= */
function renderHome(){
  renderCountdown();
  renderMiniCalendar();
  renderGuestSummary();
  renderTaskPanel();
  renderBudgetSummary();
}
function renderCountdown(){
  const wd = parseDate(STATE.weddingDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((wd-today)/86400000);
  const el = document.getElementById('countdownText');
  if(diffDays>0) el.textContent = `${formatHeDate(STATE.weddingDate)} · עוד ${diffDays} ימים לחתונה`;
  else if(diffDays===0) el.textContent = `היום זה הרגע! מזל טוב 🎉`;
  else el.textContent = `${formatHeDate(STATE.weddingDate)} · מזל טוב באיחור של ${-diffDays} ימים!`;
}

let miniCalMonth = null;
function initMiniCalMonth(){
  const dates = [...allEventDates()].sort();
  const today = todayStr();
  const upcoming = dates.find(d=>d>=today);
  const base = upcoming ? parseDate(upcoming) : new Date();
  miniCalMonth = {y:base.getFullYear(), m:base.getMonth()};
}
function buildMonthCells(y,m){
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++){
    const d = new Date(y,m,1-(startDow-i));
    cells.push({date:d, out:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({date:new Date(y,m,d), out:false});
  while(cells.length%7!==0 || cells.length<42){
    const last = cells[cells.length-1].date;
    const d = new Date(last); d.setDate(d.getDate()+1);
    cells.push({date:d, out:true});
    if(cells.length>=42) break;
  }
  return cells;
}
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function renderMiniCalendar(){
  if(!miniCalMonth) initMiniCalMonth();
  const {y,m} = miniCalMonth;
  const cells = buildMonthCells(y,m);
  const today = todayStr();
  let html = `<div class="mini-cal-nav">
    <button data-mcal="prev">‹</button>
    <span>${HEBREW_MONTHS[m]} ${y}</span>
    <button data-mcal="next">›</button>
  </div><div class="cal-grid">`;
  HEBREW_DOW.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  cells.forEach(c=>{
    const ds = dstr(c.date);
    const evs = eventsForDate(ds);
    const types = new Set(evs.map(e=>e.type));
    let dots = '';
    ['wedding','task','milestone','budget'].forEach(t=>{ if(types.has(t)) dots += `<span class="dot dot-${t}"></span>`; });
    html += `<div class="cal-day ${c.out?'out':''} ${ds===today?'today':''}" data-date="${ds}">
      ${c.date.getDate()}
      <div class="dot-row">${dots}</div>
    </div>`;
  });
  html += `</div><div class="cal-legend">
    <span><i class="dot dot-wedding" style="display:inline-block;width:7px;height:7px;border-radius:50%;"></i>חתונה</span>
    <span><i class="dot dot-task" style="display:inline-block;width:7px;height:7px;border-radius:50%;"></i>משימה</span>
    <span><i class="dot dot-milestone" style="display:inline-block;width:7px;height:7px;border-radius:50%;"></i>אירוע</span>
    <span><i class="dot dot-budget" style="display:inline-block;width:7px;height:7px;border-radius:50%;"></i>תשלום</span>
  </div>`;
  document.getElementById('miniCalendar').innerHTML = html;
  document.querySelectorAll('#miniCalendar [data-mcal]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      miniCalMonth.m += (b.dataset.mcal==='next'?1:-1);
      if(miniCalMonth.m<0){miniCalMonth.m=11;miniCalMonth.y--;}
      if(miniCalMonth.m>11){miniCalMonth.m=0;miniCalMonth.y++;}
      renderMiniCalendar();
    });
  });
  document.querySelectorAll('#miniCalendar .cal-day').forEach(d=>{
    d.addEventListener('click', e=>{
      e.stopPropagation();
      nav('calendar');
      setTimeout(()=>openDayDetail(d.dataset.date), 50);
    });
  });
}

function renderGuestSummary(){
  const t = guestTotals();
  let html = `<div class="stat-row">
    <div class="stat-box"><div class="num">${fmt(t.total)}</div><div class="lbl">סה"כ מוזמנים</div></div>
    <div class="stat-box"><div class="num">${fmt(t.approved||0)}</div><div class="lbl">מאושרים</div></div>
    <div class="stat-box"><div class="num">${fmt(t.pending||0)}</div><div class="lbl">ממתינים</div></div>
    <div class="stat-box"><div class="num">${fmt(t.declined||0)}</div><div class="lbl">לא מגיעים</div></div>
  </div><div class="side-bars">`;
  const colors = ['var(--rose)','var(--sage)','var(--gold)'];
  Object.keys(t.bySide).forEach((side,i)=>{
    const s = t.bySide[side];
    const pct = t.total? Math.round(s.total/t.total*100):0;
    html += `<div class="side-bar-row">
      <div class="side-bar-name">${esc(side)}</div>
      <div class="side-bar-track"><div class="side-bar-fill" style="width:${pct}%; background:${colors[i%colors.length]};"></div></div>
      <div class="side-bar-num">${fmt(s.total)} (${pct}%)</div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('guestSummary').innerHTML = html;
}

function renderTaskPanel(){
  const list = sortedTasks(STATE.tasks);
  let html = '';
  list.forEach(t=>{
    html += `<div class="task-row status-${t.status} urgency-${t.urgency}" data-task="${t.id}">
      <div class="task-dot"></div>
      <div class="task-body">
        <span class="task-text">${esc(t.text)}</span>
        <div class="task-meta"><span class="task-cat-tag">${esc(t.category)}</span>${t.deadline?`<span>${formatHeDate(t.deadline)}</span>`:''}</div>
      </div>
    </div>`;
  });
  document.getElementById('taskPanel').innerHTML = html || '<div class="empty-note">אין משימות עדיין</div>';
  document.querySelectorAll('#taskPanel [data-task]').forEach(row=>{
    row.addEventListener('click', e=>{
      e.stopPropagation();
      cycleTaskStatus(parseInt(row.dataset.task));
      renderTaskPanel();
    });
  });
}

function renderBudgetSummary(){
  const b = budgetTotals();
  const pct = b.cost? Math.min(100, Math.round(b.paid/b.cost*100)) : 0;
  document.getElementById('budgetSummary').innerHTML = `
    <div class="budget-progress"><div class="budget-progress-fill" style="width:${pct}%"></div></div>
    <div class="budget-nums">
      <div><b>₪${fmt(b.paid)}</b>שולם עד כה</div>
      <div style="text-align:left"><b>₪${fmt(b.remaining)}</b>נותר לתשלום</div>
    </div>`;
}

/* ================= TASKS FULL ================= */
let taskFilterState = {category:'all', urgency:'all', status:'all'};
function renderTaskFilters(){
  const el = document.getElementById('taskFilters');
  el.innerHTML = `
    <select id="fCat"><option value="all">כל הקטגוריות</option>${CATEGORIES.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
    <select id="fUrg"><option value="all">כל רמות הדחיפות</option>${Object.keys(URGENCY_LABEL).map(u=>`<option value="${u}">${URGENCY_LABEL[u]}</option>`).join('')}</select>
    <select id="fStat"><option value="all">כל הסטטוסים</option>${Object.keys(STATUS_LABEL).map(s=>`<option value="${s}">${STATUS_LABEL[s]}</option>`).join('')}</select>
  `;
  el.querySelector('#fCat').value = taskFilterState.category;
  el.querySelector('#fUrg').value = taskFilterState.urgency;
  el.querySelector('#fStat').value = taskFilterState.status;
  el.querySelector('#fCat').addEventListener('change', e=>{ taskFilterState.category=e.target.value; renderTaskFull(); });
  el.querySelector('#fUrg').addEventListener('change', e=>{ taskFilterState.urgency=e.target.value; renderTaskFull(); });

function renderTaskFull(){
  renderTaskFilters();
  let list = STATE.tasks.filter(t=>
    (taskFilterState.category==='all'||t.category===taskFilterState.category) &&
    (taskFilterState.urgency==='all'||t.urgency===taskFilterState.urgency) &&

  );

      html += `<div class="task-row-full status-${t.status}" data-task="${t.id}">

  document.getElementById('taskFull').innerHTML = html || '<div class="empty-note">אין משימות תואמות</div>';
  document.querySelectorAll('#taskFull .task-row-full').forEach(row=>{
    const id = parseInt(row.dataset.task);
    row.querySelector('[data-action="cycle"]').addEventListener('click', ()=>{ cycleTaskStatus(id); renderTaskFull(); });
    row.querySelector('[data-action="edit"]').addEventListener('click', ()=>{
      const t = STATE.tasks.find(x=>x.id===id);
      openModal('עריכת משימה', taskFormFields(t), data=>{ updateTask(id, data); renderTaskFull(); },
        `<button type="button" class="btn-danger" id="modalDelete">מחיקה</button>`);
      document.getElementById('modalDelete').addEventListener('click', ()=>{
        deleteTask(id); document.querySelector('.modal-overlay').remove(); renderTaskFull();
      });
    });
    row.querySelector('[data-action="del"]').addEventListener('click', ()=>{

/* ================= CALENDAR FULL ================= */
let calFullMonth = null;
function renderCalendarFull(){
  if(!calFullMonth){ initMiniCalMonth(); calFullMonth = {...miniCalMonth}; }
  const {y,m} = calFullMonth;
  const cells = buildMonthCells(y,m);
  const today = todayStr();
  let html = `<div class="mini-cal-nav" style="font-size:17px; margin-bottom:12px;">
    <button data-fcal="prev" style="font-size:22px;">‹</button>
    <strong>${HEBREW_MONTHS[m]} ${y}</strong>
    <button data-fcal="next" style="font-size:22px;">›</button>
  </div><div class="cal-full-grid">`;
  HEBREW_DOW.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  cells.forEach(c=>{
    const ds = dstr(c.date);
    const evs = eventsForDate(ds);
    html += `<div class="cal-full-day ${c.out?'out':''} ${ds===today?'today':''}" data-date="${ds}">
      <div class="num">${c.date.getDate()}</div>
      ${evs.slice(0,3).map(e=>`<div class="ev-line et-${e.type}">${esc(e.title)}</div>`).join('')}
      ${evs.length>3?`<div class="ev-line">+${evs.length-3} נוספים</div>`:''}
    </div>`;
  });
  html += `</div>`;
  document.getElementById('calendarFull').innerHTML = html;
  document.querySelectorAll('#calendarFull [data-fcal]').forEach(b=>{
    b.addEventListener('click', ()=>{
      calFullMonth.m += (b.dataset.fcal==='next'?1:-1);
      if(calFullMonth.m<0){calFullMonth.m=11;calFullMonth.y--;}
      if(calFullMonth.m>11){calFullMonth.m=0;calFullMonth.y++;}
      renderCalendarFull();
    });
  });
  document.querySelectorAll('#calendarFull .cal-full-day').forEach(d=>{
    d.addEventListener('click', ()=>openDayDetail(d.dataset.date));
  });
}
let noteSaveTimer = null;
function openDayDetail(dateStr){
  const panel = document.getElementById('dayDetail');
  panel.classList.remove('hidden');
  const evs = eventsForDate(dateStr);
  const isPast = dateStr < todayStr();
  const notesLabel = isPast ? 'סיכום / מה קרה בפועל' : 'הערות והכנה לקראת התאריך';
  const note = (STATE.notes && STATE.notes[dateStr]) || '';
  panel.innerHTML = `
    <h3>${formatHeDate(dateStr)}</h3>
    ${evs.length? evs.map(e=>`<div class="dd-event"><div class="dd-title">${esc(e.title)}</div>${e.note?`<div class="dd-note">${esc(e.note)}</div>`:''}</div>`).join('') : '<div class="empty-note">אין אירועים מתוזמנים בתאריך זה</div>'}
    <div class="dd-notes-label">${notesLabel} <span class="save-indicator" id="saveIndicator">נשמר ✓</span></div>
    <div class="dd-notes"><textarea id="dayNotes" placeholder="כתבו כאן...">${esc(note)}</textarea></div>
  `;
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
  const ta = document.getElementById('dayNotes');
  ta.addEventListener('input', ()=>{
    clearTimeout(noteSaveTimer);
    noteSaveTimer = setTimeout(()=>{
      STATE.notes = STATE.notes || {};
      STATE.notes[dateStr] = ta.value;
      saveState();
      const ind = document.getElementById('saveIndicator');
      if(ind){ ind.classList.add('show'); setTimeout(()=>ind.classList.remove('show'), 1200); }
    }, 500);
  });
}

function renderGuestFull(){
  renderGuestFilters();
  let list = STATE.guests.filter(g=>
    (guestFilterState.side==='all'||g.side===guestFilterState.side) &&
    (guestFilterState.status==='all'||g.status===guestFilterState.status) &&
    (!guestFilterState.q || (g.name||'').includes(guestFilterState.q))
  );
  list.sort((a,b)=>{
    const k = guestFilterState.sortKey;
    let av=a[k], bv=b[k];
    if(typeof av==='string') av=av||''; if(typeof bv==='string') bv=bv||'';
    if(av<bv) return -1*guestFilterState.sortDir;
    if(av>bv) return 1*guestFilterState.sortDir;
    return 0;
  });
  let html = `<div class="data-table-wrap"><table class="data-table"><thead><tr>
    <th data-sort="name">שם</th><th data-sort="phone">טלפון</th><th data-sort="side">צד</th>
    <th data-sort="category">קטגוריה</th><th data-sort="qty">כמות</th><th data-sort="status">סטטוס</th><th></th>
  </tr></thead><tbody>`;
  list.forEach(g=>{
    html += `<tr data-guest="${g.id}">
      <td>${esc(g.name)}</td>
      <td class="editable" data-action="editphone">${g.phone?esc(g.phone):'<span style="color:var(--ink-soft)">להוסיף</span>'}</td>
      <td>${esc(g.side||'-')}</td>
      <td>${esc(g.category||'-')}</td>
      <td>${g.qty||1}</td>
      <td><span class="pill clickable pill-${g.status}" data-action="cyclestatus">${GSTATUS_LABEL[g.status]||g.status}</span></td>
      <td><button class="icon-action" data-action="edit">✎</button><button class="icon-action" data-action="del">🗑</button></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  document.getElementById('guestFull').innerHTML = list.length ? html : '<div class="empty-note">אין מוזמנים תואמים</div>';
  document.querySelectorAll('#guestFull th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.sort;
      if(guestFilterState.sortKey===k) guestFilterState.sortDir *= -1; else { guestFilterState.sortKey=k; guestFilterState.sortDir=1; }
      renderGuestFull();
    });
  });
  document.querySelectorAll('#guestFull tr[data-guest]').forEach(row=>{
    const id = parseInt(row.dataset.guest);
    row.querySelector('[data-action="cyclestatus"]').addEventListener('click', ()=>{ cycleGuestStatus(id); renderGuestFull(); renderGuestSummary(); });
    row.querySelector('[data-action="editphone"]').addEventListener('click', function(){
      const g = STATE.guests.find(x=>x.id===id);
      const input = document.createElement('input');
      input.type='text'; input.value=g.phone||''; input.style.width='120px';
      this.innerHTML=''; this.appendChild(input); input.focus();
      const commit = ()=>{ updateGuest(id, {phone:input.value.trim()}); renderGuestFull(); };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); });
    });
    row.querySelector('[data-action="edit"]').addEventListener('click', ()=>{
      const g = STATE.guests.find(x=>x.id===id);
      openModal('עריכת מוזמן', guestFormFields(g), data=>{ data.qty=parseInt(data.qty)||1; updateGuest(id, data); renderGuestFull(); renderGuestSummary(); });
    });
    row.querySelector('[data-action="del"]').addEventListener('click', ()=>{
      if(confirm('למחוק את המוזמן?')){ deleteGuest(id); renderGuestFull(); renderGuestSummary(); }
    });
  });
}

/* ================= export / import / reset ================= */
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('btnExport').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'wedding-dashboard-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById('btnImport').addEventListener('click', ()=>{
    document.getElementById('fileImport').click();
  });
  document.getElementById('fileImport').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed.guests)) throw new Error('bad shape');
        STATE = parsed;
        STATE.notes = STATE.notes || {};
        saveState();
        nav('home');
        alert('הנתונים יובאו בהצלחה');
      }catch(err){ alert('קובץ לא תקין'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    if(confirm('לאפס את כל הנתונים לנתוני המקור מהאקסל? כל השינויים שביצעתם יימחקו.')){
      STATE = JSON.parse(JSON.stringify(DATA_DEFAULT));
      STATE.notes = {};
      saveState();
      nav('home');
    }
  });
  document.getElementById('btnHome').addEventListener('click', ()=>nav('home'));
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>nav(el.dataset.nav));
  });

  STATE = loadState();
  document.getElementById('coupleTitle').innerHTML = `${esc(STATE.coupleNames.b)} <span class="amp">&</span> ${esc(STATE.coupleNames.a)}`;
  showView('view-home');
  document.getElementById('view-home').classList.add('visible');
  renderHome();
});
